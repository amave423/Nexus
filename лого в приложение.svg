    <!-- gap where the green stroke crosses over the silver one -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="337" height="151">
      <rect width="337" height="151" fill="#fff"/>
      <g fill="#000" stroke="#000" stroke-width="1.8">
