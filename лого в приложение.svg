    <path id="u" d="M204.6 63.1H211V92.6Q211 94.6 213 94.6H236.7Q238.7 94.6 238.7 92.6V63.1H245.3V93.7A6 6 0 0 1 239.3 99.7H210.6A6 6 0 0 1 204.6 93.7Z"/>
    <path id="s" d="M297.7 63.1V68.5H268.6Q266.6 68.5 266.6 70.5V76.7Q266.6 78.7 268.6 78.7H293.2A5.5 5.5 0 0 1 298.7 84.2V94.2A5.5 5.5 0 0 1 293.2 99.7H260.2V94.6H290.9Q292.9 94.6 292.9 92.6V86.1Q292.9 84.1 290.9 84.1H265.5A5.5 5.5 0 0 1 260 78.6V68.6A5.5 5.5 0 0 1 265.5 63.1Z"/>

    <clipPath id="clip-n"><use xlink:href="#n"/></clipPath>
    <clipPath id="clip-e"><use xlink:href="#e"/></clipPath>
