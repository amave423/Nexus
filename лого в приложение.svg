  </g>
  <g mask="url(#gap)">
    <use xlink:href="#xs" fill="url(#silver)"/>
    <use xlink:href="#xs" fill="#000" opacity="0.08"/>
    <use xlink:href="#xs" clip-path="url(#clip-xs)" fill="none" stroke="#fff" stroke-width="1.6" stroke-opacity="0.12"/>
  </g>

  <!-- thin bright bevel along the inner edge of each silver glyph -->
  <g fill="none" stroke="#fff" stroke-width="1.6" stroke-opacity="0.12">
