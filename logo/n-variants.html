<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>NEXUS — варианты N</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--ink:#08080a;--dim:#8f8f9d;--txt:#e8e8ec}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--txt);font-family:"Space Grotesk",system-ui,sans-serif;padding:40px clamp(16px,3vw,48px) 80px}
  h1{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-weight:500;margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
  @media (max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media (max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .cell{background:radial-gradient(120% 90% at 50% 0%,#181820,#0a0a0e 70%);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:18px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .cell svg{width:100%;height:auto;max-width:150px;display:block}
  .num{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
  .num b{color:#c8ff3d;font-weight:500}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".10" stop-color="#dfe6ee"/>
      <stop offset=".24" stop-color="#8e97a3"/>
      <stop offset=".37" stop-color="#c9d1db"/>
      <stop offset=".49" stop-color="#2b3038"/>
      <stop offset=".55" stop-color="#79818c"/>
      <stop offset=".65" stop-color="#f4f7fa"/>
      <stop offset=".79" stop-color="#98a1ac"/>
      <stop offset="1" stop-color="#dfe5ec"/>
    </linearGradient>
    <linearGradient id="chromeUp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".12" stop-color="#dbe3ec"/>
      <stop offset=".28" stop-color="#848d99"/>
      <stop offset=".42" stop-color="#cdd5df"/>
      <stop offset=".53" stop-color="#262b32"/>
      <stop offset=".60" stop-color="#79818c"/>
      <stop offset=".72" stop-color="#eef3f8"/>
      <stop offset=".86" stop-color="#939ca7"/>
      <stop offset="1" stop-color="#e2e8ef"/>
    </linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset=".22" stop-color="#c2cad4"/>
      <stop offset=".40" stop-color="#e8edf3"/>
      <stop offset=".52" stop-color="#9aa3ae"/>
      <stop offset=".64" stop-color="#dfe5ec"/>
      <stop offset=".84" stop-color="#aeb7c2"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="gun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd6e0"/>
      <stop offset=".18" stop-color="#5d646e"/>
      <stop offset=".40" stop-color="#8f98a3"/>
      <stop offset=".50" stop-color="#23272d"/>
      <stop offset=".62" stop-color="#4c525a"/>
      <stop offset=".8" stop-color="#a9b1bc"/>
      <stop offset="1" stop-color="#3d434a"/>
    </linearGradient>
    <linearGradient id="titan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf4e8"/>
      <stop offset=".14" stop-color="#dcc4a4"/>
      <stop offset=".3" stop-color="#9c7a52"/>
      <stop offset=".46" stop-color="#f2e0c8"/>
      <stop offset=".54" stop-color="#4a3a28"/>
      <stop offset=".64" stop-color="#c9a87e"/>
      <stop offset=".82" stop-color="#f7ead9"/>
      <stop offset="1" stop-color="#a9855c"/>
    </linearGradient>

    <path id="nBase" d="M20 80V20H34L66 62V20H80V80H66L34 38V80Z"/>
    <path id="nThin" d="M20 80V20H28L72 70V20H80V80H72L28 30V80Z"/>
    <path id="nRibbon" d="M20 84V16H38V46L62 16H84V84H66V54L42 84Z"/>
    <path id="nPlate" fill-rule="evenodd" d="M16 8H84A8 8 0 0 1 92 16V84A8 8 0 0 1 84 92H16A8 8 0 0 1 8 84V16A8 8 0 0 1 16 8ZM28 74V26H39L61 56V26H72V74H61L39 44V74Z"/>
    <path id="nDisc" fill-rule="evenodd" d="M50 4a46 46 0 1 0 0 92a46 46 0 1 0 0-92ZM32 72V28H41L59 56V28H68V72H59L41 44V72Z"/>
    <clipPath id="halfL"><rect x="0" y="0" width="50" height="100"/></clipPath>
    <clipPath id="halfR"><rect x="50" y="0" width="50" height="100"/></clipPath>
    <clipPath id="diagA"><polygon points="0,0 100,0 0,100"/></clipPath>
    <clipPath id="diagB"><polygon points="100,0 100,100 0,100"/></clipPath>
  </defs>
</svg>

<h1>Nexus · десять вариантов знака</h1>

<div class="grid">

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <use href="#nBase" fill="url(#chrome)"/>
      <use href="#nBase" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.4" transform="translate(-1 -1)"/>
      <use href="#nBase" fill="none" stroke="#000000" stroke-opacity=".55" stroke-width="1.4" transform="translate(1.2 1.2)"/>
    </svg>
    <div class="num"><b>01</b> · срез</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <path d="M18 82V18H32V82Z" transform="translate(9 9)" fill="#000" fill-opacity=".55"/>
      <path d="M36 18H50L64 82H50Z" transform="translate(9 9)" fill="#000" fill-opacity=".55"/>
      <path d="M68 18H82V82H68Z" transform="translate(9 9)" fill="#000" fill-opacity=".55"/>
      <path d="M18 82V18H32V82Z" fill="url(#chrome)" transform="translate(2 2)"/>
      <path d="M36 18H50L64 82H50Z" fill="url(#chromeUp)" transform="translate(2 2)"/>
      <path d="M68 18H82V82H68Z" fill="url(#chrome)" transform="translate(2 2)"/>
    </svg>
    <div class="num"><b>02</b> · сдвиг</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <g clip-path="url(#halfL)"><use href="#nBase" transform="translate(-3.5 0)" fill="url(#chrome)"/></g>
      <g clip-path="url(#halfR)"><use href="#nBase" transform="translate(3.5 0)" fill="url(#chromeUp)"/></g>
      <g clip-path="url(#halfL)"><use href="#nBase" transform="translate(-4.5 -1)" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.2"/></g>
      <g clip-path="url(#halfR)"><use href="#nBase" transform="translate(4.5 1)" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.2"/></g>
    </svg>
    <div class="num"><b>03</b> · разлом</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <use href="#nPlate" fill="url(#chromeUp)"/>
      <use href="#nPlate" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2" transform="translate(-1 -1)"/>
      <use href="#nPlate" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.2" transform="translate(1 1)"/>
    </svg>
    <div class="num"><b>04</b> · вырез</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <g transform="translate(12 0) skewX(-12)">
        <use href="#nBase" fill="url(#chrome)"/>
        <use href="#nBase" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.4" transform="translate(-1 -1)"/>
        <use href="#nBase" fill="none" stroke="#000000" stroke-opacity=".55" stroke-width="1.4" transform="translate(1.2 1.2)"/>
      </g>
    </svg>
    <div class="num"><b>05</b> · наклон</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <use href="#nDisc" fill="url(#chrome)"/>
      <use href="#nDisc" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="1.2" transform="translate(-1 -1)"/>
      <use href="#nDisc" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.2" transform="translate(1 1)"/>
    </svg>
    <div class="num"><b>06</b> · печать</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <use href="#nBase" fill="url(#gun)"/>
      <path d="M34 20L66 62L66 71L34 29Z" fill="url(#alu)"/>
      <path d="M34 32L66 74L66 80L34 38Z" fill="#000" fill-opacity=".45"/>
      <use href="#nBase" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.2" transform="translate(-1 -1)"/>
    </svg>
    <div class="num"><b>07</b> · фаска</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <g clip-path="url(#diagA)"><use href="#nPlate" fill="url(#chrome)"/></g>
      <g clip-path="url(#diagB)"><use href="#nPlate" fill="url(#gun)"/></g>
      <g clip-path="url(#diagA)"><use href="#nPlate" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2" transform="translate(-1 -1)"/></g>
    </svg>
    <div class="num"><b>08</b> · две стали</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <use href="#nThin" fill="url(#alu)"/>
      <use href="#nThin" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="1.3" transform="translate(-1 -1)"/>
      <use href="#nThin" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="1.3" transform="translate(1 1)"/>
    </svg>
    <div class="num"><b>09</b> · контраст</div>
  </div>

  <div class="cell">
    <svg viewBox="0 0 100 100">
      <use href="#nBase" transform="translate(10 10)" fill="#1d2127"/>
      <use href="#nBase" transform="translate(8 8)" fill="#272c33"/>
      <use href="#nBase" transform="translate(6 6)" fill="#343a42"/>
      <use href="#nBase" transform="translate(4.4 4.4)" fill="#434a53"/>
      <use href="#nBase" transform="translate(2.8 2.8)" fill="#565d67"/>
      <use href="#nBase" transform="translate(1.4 1.4)" fill="#6f7782"/>
      <use href="#nBase" fill="url(#chrome)"/>
    </svg>
    <div class="num"><b>10</b> · изометрия</div>
  </div>

</div>

</body>
</html>
