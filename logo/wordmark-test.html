<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>NEXUS · знак</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  body{margin:0;background:#08080a;color:#8f8f9d;font-family:system-ui;display:grid;place-items:center;min-height:100vh;gap:40px;padding:40px}
  .big svg{width:min(72vw,720px)}
  .row{display:flex;gap:40px;align-items:center}
  .row svg{width:180px}
  .row svg.small{width:92px}
  .cap{font:10px "JetBrains Mono",monospace;letter-spacing:.2em;text-transform:uppercase;opacity:.6;text-align:center}
  div{display:grid;gap:12px;justify-items:center}
</style>
</head>
<body>
  <div class="big"><img src="nexus-wordmark.svg" alt="" style="width:min(72vw,760px);display:block"></div>
  <div class="row">
    <div><img src="nexus-wordmark.svg" alt="" style="width:200px;display:block"><span class="cap">200</span></div>
    <div><img src="nexus-wordmark.svg" alt="" style="width:112px;display:block"><span class="cap">112</span></div>
    <div><img src="nexus-wordmark.svg" alt="" style="width:72px;display:block"><span class="cap">72</span></div>
  </div>
</body>
</html>
