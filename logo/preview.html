<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>NEXUS — бренд</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{--acid:#c8ff3d;--ink:#08080a;--panel:#0e0e13;--dim:#8f8f9d;--txt:#e8e8ec}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);color:var(--txt);font-family:"Space Grotesk",system-ui,sans-serif;padding:44px clamp(20px,4vw,64px) 90px;display:grid;gap:52px}
  h2{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-weight:500;margin-bottom:20px}
  .row{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}
  .tile{width:150px;height:150px;border-radius:34px;display:grid;place-items:center;background:var(--panel);border:1px solid rgba(255,255,255,.08)}
  .tile.clean{background:transparent;border-color:transparent}
  .cap{font-family:"JetBrains Mono",monospace;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);text-align:center;margin-top:10px}
  .acid-tile{background:var(--acid);border-color:transparent}
  .sizes{display:flex;gap:30px;align-items:flex-end;background:var(--panel);border:1px solid rgba(255,255,255,.07);border-radius:20px;padding:26px 30px}
  .sizes>div{text-align:center}
  .lockwrap{display:inline-block}
  .palette{display:flex;gap:12px;flex-wrap:wrap}
  .sw{width:112px;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
  .sw i{display:block;height:64px}
  .sw b,.sw span{display:block;padding:0 12px;font-family:"JetBrains Mono",monospace;font-size:9.5px;letter-spacing:.08em}
  .sw b{padding-top:10px;color:var(--txt);font-weight:500}
  .sw span{padding-bottom:10px;color:var(--dim);text-transform:uppercase;font-size:8.5px}
</style>
</head>
<body>

<section>
  <h2>01 · знак</h2>
  <div class="row">
    <div><div class="tile"><img src="mark.svg" width="80" height="80" alt=""></div><div class="cap">основной</div></div>
    <div><div class="tile acid-tile"><img src="mark.svg" width="80" height="80" alt="" style="filter:brightness(0) saturate(100%)"></div><div class="cap">инверсия</div></div>
    <div><div class="tile clean"><img src="mark.svg" width="80" height="80" alt="" style="filter:brightness(0) invert(1)"></div><div class="cap">белый</div></div>
  </div>
</section>

<section>
  <h2>02 · масштаб</h2>
  <div class="sizes">
    <div><img src="mark.svg" width="64" height="64" alt=""><div class="cap">64</div></div>
    <div><img src="mark.svg" width="40" height="40" alt=""><div class="cap">40</div></div>
    <div><img src="mark.svg" width="28" height="28" alt=""><div class="cap">28</div></div>
    <div><img src="mark.svg" width="20" height="20" alt=""><div class="cap">20</div></div>
    <div><img src="mark.svg" width="16" height="16" alt=""><div class="cap">16</div></div>
  </div>
</section>

<section>
  <h2>03 · логотип</h2>
  <div class="row">
    <div><img src="logo-horizontal.svg" width="320" alt=""><div class="cap">на тёмном</div></div>
    <div><img src="logo-inverse.svg" width="320" alt=""><div class="cap">на акценте</div></div>
  </div>
</section>

<section>
  <h2>04 · иконка приложения</h2>
  <div class="row">
    <div><img src="app-icon.svg" width="128" alt=""><div class="cap">256 / 128</div></div>
    <div><img src="app-icon.svg" width="64" alt=""><div class="cap">64</div></div>
    <div><img src="app-icon.svg" width="40" alt=""><div class="cap">40</div></div>
    <div><img src="app-icon.svg" width="24" alt=""><div class="cap">24</div></div>
    <div><img src="app-icon.svg" width="16" alt=""><div class="cap">16</div></div>
  </div>
</section>

<section>
  <h2>05 · палитра</h2>
  <div class="palette">
    <div class="sw"><i style="background:#c8ff3d"></i><b>#c8ff3d</b><span>акцент</span></div>
    <div class="sw"><i style="background:#08080a"></i><b>#08080a</b><span>чернила</span></div>
    <div class="sw"><i style="background:#0e0e13"></i><b>#0e0e13</b><span>панель</span></div>
    <div class="sw"><i style="background:#e8e8ec"></i><b>#e8e8ec</b><span>текст</span></div>
    <div class="sw"><i style="background:#8f8f9d"></i><b>#8f8f9d</b><span>вторичный</span></div>
  </div>
</section>

</body>
</html>
