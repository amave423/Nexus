<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; background: transparent; overflow: hidden; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #eef1f4;
        -webkit-user-select: none;
        user-select: none;
      }
      .card {
        position: relative;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px 16px 20px;
        border-radius: 16px;
        overflow: hidden;
        background:
          radial-gradient(120% 140% at 0% 0%, rgba(255, 255, 255, 0.06), transparent 60%),
          #0e1013;
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
        animation: slide 260ms cubic-bezier(0.2, 0.9, 0.3, 1);
      }
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: var(--acid, #c8ff3d);
        box-shadow: 0 0 18px var(--acid, #c8ff3d);
      }
      @keyframes slide {
        from { opacity: 0; transform: translateX(26px) scale(0.97); }
        to { opacity: 1; transform: none; }
      }
      .av {
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        border-radius: 13px;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        color: #08080a;
        background-size: cover;
        background-position: center;
        letter-spacing: 0.02em;
      }
      .body { min-width: 0; flex: 1; }
      .top { display: flex; align-items: baseline; gap: 8px; }
      .name { font-weight: 650; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tag {
        font-size: 9.5px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--acid, #c8ff3d);
        opacity: 0.9;
        flex: 0 0 auto;
      }
      .text {
        margin-top: 3px;
        font-size: 13px;
        line-height: 1.35;
        color: #b6beca;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="card" id="card">
      <div class="av" id="av"></div>
      <div class="body">
        <div class="top">
          <span class="name" id="name"></span>
          <span class="tag" id="tag">nexus</span>
        </div>
        <div class="text" id="text"></div>
      </div>
    </div>
    <script>
      const $ = (id) => document.getElementById(id);
      let channelId = null;

      window.nexus.notify.onData((payload) => {
        channelId = payload.channelId || null;
        if (payload.accent) document.documentElement.style.setProperty("--acid", payload.accent);
        $("name").textContent = payload.name || "";
        $("text").textContent = payload.text || "";
        $("tag").textContent = payload.channel ? `#${payload.channel}` : "nexus";
        const av = $("av");
        if (payload.avatar) {
          av.style.backgroundImage = `url("${payload.avatar}")`;
          av.textContent = "";
        } else {
          av.textContent = (payload.name || "?").slice(0, 2).toUpperCase();
          av.style.background = payload.color || "#c8ff3d";
        }
      });

      document.addEventListener("click", () => window.nexus.notify.open(channelId));
    </script>
  </body>
</html>
